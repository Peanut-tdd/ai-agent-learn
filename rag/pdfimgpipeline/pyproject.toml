[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdfimgpipeline"
version = "0.1.0"
description = "文档图像 OCR / VLM 智能路由与执行服务"
readme = "readme.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "opencv-python>=4.8",
    "numpy>=1.24",
    "redis>=4.2",
    # RapidOCR 目前仅支持 Python <3.13；3.13 上跳过，服务仍可跑（OCR 通道降级）
    "rapidocr-onnxruntime>=1.2; python_version < '3.13'",
    # onnxruntime 1.22+ 的 macOS wheel 要求 macOS 13.4+；本机 13.0 需要 <1.22
    "onnxruntime>=1.17,<1.22; python_version < '3.13'",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.scripts]
pdfimgpipeline = "pdfimgpipeline.service.app:run"

[tool.hatch.build.targets.wheel]
packages = ["src/pdfimgpipeline"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
